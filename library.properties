name=Giga-USBH-tinyusb
version=0.1.0
author=controllercustom
maintainer=controllercustom
sentence=TinyUSB USB-A host stack for the Arduino GIGA R1 WiFi (serial bridges, MIDI, HID, gamepads, mass storage).
paragraph=Standalone alternative to Arduino_USBHostMbed5 with no mbed USB code. Owns the USB-A host port (OTG_HS) via a pinned host-only TinyUSB tree while Mbed keeps clocks and the USB-C CDC console. VBUS is powered via PA_15. 16 examples cover descriptor dumps, FTDI/PL2303/CP2102 bridges, MIDI, keyboard/mouse (incl. concurrent boot via hub), joysticks/gamepads, 3x CDC concurrent, and mass storage (raw SCSI + FAT).
url=https://github.com/controllercustom/Giga-USBH-tinyusb
architectures=mbed_giga
includes=GigaTinyUSB.h
license=MIT
tags=usb, usb-host, giga, tinyusb, serial, ftdi, midi, hid, gamepad
